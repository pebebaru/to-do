<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none">
  <defs>
    <linearGradient id="bg-tile" x1="0" y1="0" x2="600" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#0c0e13"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clean dark backdrop container -->
  <rect width="600" height="200" rx="36" fill="url(#bg-tile)"/>
  <rect width="596" height="196" x="2" y="2" rx="34" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Brand Mark Icon Tile on Left -->
  <g transform="translate(48, 44)">
    <rect width="112" height="112" rx="28" fill="#181B22" stroke="#2A3342" stroke-width="1.5"/>
    <!-- Intention Dot (Muted silver) -->
    <circle cx="42" cy="42" r="8" fill="#94A3B8"/>
    <!-- Execution Dot (Vibrant electric blue) -->
    <circle cx="42" cy="70" r="8" fill="url(#blue-grad)"/>
    <!-- Momentum chevron '> -->
    <path d="M64 40 L82 56 L64 72" stroke="url(#cyan-glow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typographic Wordmark "to:DO" -->
  <g transform="translate(192, 126)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif">
    <!-- Lowercase "to" in crisp matte white / titanium -->
    <text x="0" y="0" font-size="76" font-weight="600" fill="#F8FAFC" letter-spacing="-1.5">to</text>
    
    <!-- Stylized Colon ":" with luminous execution glow -->
    <g filter="url(#neon-glow)">
      <!-- Top Colon dot -->
      <circle cx="85" cy="-44" r="7" fill="#60A5FA"/>
      <!-- Bottom Colon dot -->
      <circle cx="85" cy="-14" r="7" fill="#3B82F6"/>
    </g>

    <!-- Uppercase "DO" in bold electric blue gradient accent -->
    <text x="110" y="0" font-size="76" font-weight="900" fill="url(#blue-grad)" letter-spacing="-0.5">DO</text>
  </g>
</svg>